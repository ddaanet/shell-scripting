# Dev tooling only; nothing here is a Python package. `uv sync` materializes
# `.venv/bin`, which `.envrc` puts on PATH. PyYAML is there because the venv's
# python3 shadows the system one, and `just precommit` runs
# `scripts/check-frontmatter.py`, which imports it.
[project]
name = "shell-gotchas-dev"
version = "0"
requires-python = ">=3.9"

[dependency-groups]
dev = ["rumdl>=0.3.2", "pyyaml>=6"]

[tool.uv]
package = false
